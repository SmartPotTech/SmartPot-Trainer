[project]
name = "smartpot-trainer"
version = "1.0.0"
description = "Servicio de entrenamiento y aprendizaje continuo de SmartPot (Champion-Challenger, LoRA, K-Means, Isolation Forest)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.37",
    "pydantic-settings>=2.11",
    "numpy>=2.3",
    "scikit-learn>=1.7",
    "polars[rtcompat]>=1.0",
    "joblib>=1.4",
    "httpx>=0.28",
    "typing-extensions>=4.12",
    "adbc-driver-postgresql>=1.0",
    "pyarrow>=18.0",
    "skl2onnx>=1.17",
    "onnx>=1.17",
    "cryptography>=43.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.13",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx`"]
